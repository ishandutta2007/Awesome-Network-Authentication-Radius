<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="meshCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.04); }
      }
      @keyframes packetTravel1 {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packetTravel2 {
        0% { stroke-dashoffset: 350; }
        100% { stroke-dashoffset: -350; }
      }
      @keyframes shieldFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pillFade {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }

      .bg-glow {
        transform-origin: 600px 170px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .packet-line-1 {
        stroke-dasharray: 12 180;
        animation: packetTravel1 4s linear infinite;
      }
      .packet-line-2 {
        stroke-dasharray: 16 220;
        animation: packetTravel2 5s linear infinite;
      }
      .shield-anim {
        transform-origin: 950px 170px;
        animation: shieldFloat 4s ease-in-out infinite;
      }
      .badge-pill {
        animation: pillFade 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="280" y1="0" x2="280" y2="340" />
    <line x1="440" y1="0" x2="440" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="760" y1="0" x2="760" y2="340" />
    <line x1="920" y1="0" x2="920" y2="340" />
    <line x1="1080" y1="0" x2="1080" y2="340" />
  </g>

  <!-- Dynamic Center Radial Glow -->
  <circle cx="600" cy="170" r="380" fill="url(#meshCenterGlow)" class="bg-glow" />

  <!-- Network Circuit Lines & Dynamic Packets -->
  <g fill="none" stroke-linecap="round">
    <!-- Static circuit traces -->
    <path d="M 80,170 H 220 L 290,110 H 510 L 570,170 H 830 L 910,230 H 1120" stroke="#1e293b" stroke-width="2"/>
    <path d="M 140,240 H 330 L 400,280 H 720 L 780,220 H 1050" stroke="#1e293b" stroke-width="2"/>
    <path d="M 200,80 H 420 L 480,140 H 800 L 860,80 H 1090" stroke="#1e293b" stroke-width="2"/>

    <!-- Animated Data Stream Packets -->
    <path d="M 80,170 H 220 L 290,110 H 510 L 570,170 H 830 L 910,230 H 1120" stroke="#00f2fe" stroke-width="2.5" class="packet-line-1" filter="url(#neonGlow)"/>
    <path d="M 140,240 H 330 L 400,280 H 720 L 780,220 H 1050" stroke="#818cf8" stroke-width="2.5" class="packet-line-2" filter="url(#neonGlow)"/>
    <path d="M 200,80 H 420 L 480,140 H 800 L 860,80 H 1090" stroke="#38bdf8" stroke-width="2" class="packet-line-1" filter="url(#neonGlow)"/>
  </g>

  <!-- Node Dots along circuits -->
  <g fill="#0e172a" stroke="#38bdf8" stroke-width="2">
    <circle cx="220" cy="170" r="4"/>
    <circle cx="290" cy="110" r="4"/>
    <circle cx="510" cy="110" r="4"/>
    <circle cx="570" cy="170" r="4"/>
    <circle cx="780" cy="220" r="4"/>
    <circle cx="860" cy="80" r="4"/>
  </g>

  <!-- Right Side Decorative Graphic: 802.1X / RADIUS AAA Security Hub -->
  <g class="shield-anim" transform="translate(930, 80)">
    <!-- Outer concentric rings -->
    <circle cx="90" cy="90" r="82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.4"/>
    <circle cx="90" cy="90" r="70" fill="#0f172a" stroke="url(#primaryAccent)" stroke-width="2" filter="url(#softShadow)"/>

    <!-- AAA Lock Shield Icon -->
    <path d="M 90,45 L 125,58 V 88 C 125,114 110,132 90,140 C 70,132 55,114 55,88 V 58 Z" fill="url(#shieldGlow)" opacity="0.85"/>
    <path d="M 90,52 L 118,63 V 88 C 118,109 106,124 90,131 C 74,124 62,109 62,88 V 63 Z" fill="#0b1329"/>
    
    <!-- Keyhole / Verification check -->
    <circle cx="90" cy="84" r="7" fill="#38bdf8"/>
    <path d="M 87,88 H 93 L 95,102 H 85 Z" fill="#38bdf8"/>

    <!-- Floating Security Nodes -->
    <circle cx="30" cy="40" r="8" fill="#10b981" filter="url(#neonGlow)"/>
    <text x="30" y="43" fill="#ffffff" font-size="8" font-family="monospace" text-anchor="middle" font-weight="bold">✓</text>
    <circle cx="150" cy="140" r="9" fill="#6366f1" filter="url(#neonGlow)"/>
    <text x="150" y="143" fill="#ffffff" font-size="7" font-family="monospace" text-anchor="middle" font-weight="bold">AAA</text>
  </g>

  <!-- Foreground Content: Strict foreground hierarchy -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 68)">
      <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
      <text x="26" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ENTERPRISE AAA / NAC</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="138" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5" filter="url(#softShadow)">
      Awesome Network Authentication &amp; RADIUS
    </text>

    <!-- Subtitle -->
    <text x="0" y="176" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500">
      Curated directory of AAA servers, 802.1X/EAP-TLS engines, Zero Trust NAC &amp; Cloud RADIUS platforms
    </text>

    <!-- Feature Badges / Technology Pills -->
    <g transform="translate(0, 216)" class="badge-pill">
      <!-- Pill 1: 802.1X & EAP-TLS -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="65" y="21" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ 802.1X &amp; EAP-TLS</text>
      </g>

      <!-- Pill 2: Cloud RADIUS -->
      <g transform="translate(142, 0)">
        <rect width="124" height="34" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="62" y="21" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ Cloud RADIUS</text>
      </g>

      <!-- Pill 3: Self-Hosted AAA -->
      <g transform="translate(278, 0)">
        <rect width="128" height="34" rx="8" fill="#111827" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="64" y="21" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ FreeRADIUS &amp; NAC</text>
      </g>

      <!-- Pill 4: RadSec / TLS -->
      <g transform="translate(418, 0)">
        <rect width="118" height="34" rx="8" fill="#111827" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="59" y="21" fill="#fce7f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔒 RadSec / RFC 6614</text>
      </g>

      <!-- Pill 5: Zero Trust Access -->
      <g transform="translate(548, 0)">
        <rect width="138" height="34" rx="8" fill="#111827" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="69" y="21" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Zero Trust Policy</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#primaryAccent)"/>
</svg>
